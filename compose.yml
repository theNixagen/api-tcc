services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alpr-api
    depends_on:
      postgres-migrations:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      PYTHONUNBUFFERED: "1"
    ports:
      - "${API_PORT}:8000"
    networks:
      - public
      - private
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: alpr-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - private
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alpr -d alpr"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-migrations:
    image: postgres:16-alpine
    container_name: alpr-postgres-migrations
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./db/migrations:/migrations:ro
    networks:
      - private
    command: ["psql", "-h", "${POSTGRES_HOST}", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}", "-v", "ON_ERROR_STOP=1", "-f", "/migrations/001_create_eventos.sql"]
    restart: "no"

networks:
  public:
  private:
    internal: true

volumes:
  postgres_data:
